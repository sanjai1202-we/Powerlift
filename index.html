<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AR Video</title>
 
<!--
  MindAR's ES module build imports "three" using a bare specifier
  internally (import ... from "three"). Without this import map the
  browser cannot resolve that bare specifier and the whole module
  fails to load silently (black screen, no error, nothing in the
  console UI). This map points "three" at the exact same CDN file
  our own script uses, so both resolve to one shared instance.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
 
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
 
  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
 
  /* MindAR owns the camera + AR canvas. Do not manually move its children. */
  #ar-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
 
  /* MindAR creates the camera preview and AR canvas inside this container.
     Keep the camera visible underneath the transparent AR layer. */
  #ar-container > div {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
  }
 
  #ar-container video {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 0 !important;
  }
 
  #ar-container canvas {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
    background: transparent !important;
  }
 
  /* Only the small instruction is visible before the poster is found. */
  #focus-message {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 20;
    padding: 8px 14px;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 13px;
    white-space: nowrap;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.2s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
 
  #focus-message.hidden {
    opacity: 0;
  }
 
  /* Audio control appears only after the poster is detected. */
  #audio-btn {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 30;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: 22px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
 
  #audio-btn.show {
    display: flex;
  }
 
  #audio-btn:active {
    transform: scale(0.92);
  }
 
  #error-message {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    z-index: 40;
    max-width: calc(100% - 32px);
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.78);
    color: #ff7070;
    font-size: 13px;
    text-align: center;
    display: none;
  }
 
  #error-message.show {
    display: block;
  }
 
  /* Always-visible step-by-step status, for debugging only.
     Delete this block plus #debug-status below once things work. */
  #debug-status {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 50;
    max-width: calc(100% - 16px);
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #7CFC7C;
    font-size: 11px;
    font-family: monospace;
    white-space: pre-wrap;
    pointer-events: none;
  }
</style>
</head>
 
<body>
 
<div id="ar-container"></div>
 
<div id="focus-message">Focus the camera on the image</div>
 
<button id="audio-btn" type="button" aria-label="Unmute video">🔇</button>
 
<div id="error-message"></div>
 
<div id="debug-status">starting…</div>
 
<script type="module">
  const focusMessage = document.getElementById("focus-message");
  const audioBtn = document.getElementById("audio-btn");
  const errorMessage = document.getElementById("error-message");
  const debugStatus = document.getElementById("debug-status");
 
  function setStatus(message) {
    console.log("[AR]", message);
    if (debugStatus) debugStatus.textContent = message;
  }
 
  setStatus("script loaded, waiting for DOM…");
 
  const TARGET_ASPECT = 949 / 1657;
  const VIDEO_ROTATION_DEG = 0;
 
  function showError(message) {
    console.error("[AR]", message);
    errorMessage.textContent = message;
    errorMessage.classList.add("show");
  }
 
  function hideError() {
    errorMessage.classList.remove("show");
  }
 
  // Safety net: surface anything that slips past our own try/catch
  // blocks so the page never fails silently with a plain black screen.
  window.addEventListener("error", (event) => {
    showError(event.message || "A script error occurred.");
  });
 
  window.addEventListener("unhandledrejection", (event) => {
    const reason = event.reason;
    showError(
      reason && reason.message ? reason.message : "A script error occurred."
    );
  });
 
  function cameraError(error) {
    const name = error && error.name;
 
    if (name === "NotAllowedError" || name === "PermissionDeniedError") {
      return "Camera permission was denied. Allow camera access for this site and reload.";
    }
 
    if (name === "NotFoundError" || name === "DevicesNotFoundError") {
      return "No camera was found on this device.";
    }
 
    if (name === "NotReadableError" || name === "TrackStartError") {
      return "The camera is being used by another app or browser tab.";
    }
 
    if (name === "SecurityError") {
      return "Camera access requires HTTPS.";
    }
 
    return (name || "Camera error") + ": " +
      (error && error.message ? error.message : String(error));
  }
 
  let THREE;
  let MindARThree;
 
  async function loadLibraries() {
    setStatus("loading three.js…");
 
    // Dynamic imports so a CDN/network failure surfaces as a visible
    // error message instead of silently leaving a black screen.
    try {
      THREE = await import(
        "https://unpkg.com/three@0.160.0/build/three.module.js?v=160"
      );
    } catch (error) {
      throw new Error(
        "Could not load three.js from the CDN. Check your internet connection and reload."
      );
    }
 
    setStatus("loading MindAR…");
 
    // jsdelivr is blocked on some ISPs/networks/ad-blockers, so try
    // unpkg first (same CDN that successfully served three.js above),
    // then fall back to jsdelivr if unpkg itself is unavailable.
    const mindArUrls = [
      "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
      "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    ];
 
    let MindARModule;
    let lastError;
 
    for (const url of mindArUrls) {
      try {
        MindARModule = await import(url + "?v=125");
        break;
      } catch (error) {
        lastError = error;
        setStatus("MindAR failed from " + new URL(url).hostname + ", trying next source…");
      }
    }
 
    if (!MindARModule) {
      throw new Error(
        "Could not load MindAR from any CDN (unpkg or jsdelivr). This is likely a network/ISP/ad-blocker block. Try a different network (e.g. mobile data instead of WiFi) or disable ad-blocking extensions."
      );
    }
 
    MindARThree = MindARModule.MindARThree;
 
    if (!MindARThree) {
      throw new Error("MindARThree failed to load from the MindAR CDN.");
    }
 
    setStatus("libraries loaded");
  }
 
  async function startAR() {
    try {
      hideError();
      setStatus("startAR() running…");
 
      if (!MindARThree) {
        await loadLibraries();
      }
 
      /*
       * IMPORTANT:
       * Do not manually position MindAR's injected camera video/canvas.
       * MindAR handles the camera presentation and AR canvas together.
       */
      setStatus("creating MindARThree instance…");
 
      const mindarThree = new MindARThree({
        container: document.querySelector("#ar-container"),
        imageTargetSrc: "./targets.mind",
        uiScanning: false,
        uiLoading: false,
        uiError: false,
        filterMinCF: 0.0001,
        filterBeta: 50,
        warmupTolerance: 3,
        missTolerance: 5
      });
 
      const {
        renderer,
        scene,
        camera
      } = mindarThree;
 
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
 
      // The AR canvas must be transparent so the real camera stays visible.
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.style.background = "transparent";
      renderer.domElement.style.pointerEvents = "none";
 
      const anchor = mindarThree.addAnchor(0);
 
      /* ---------------- VIDEO ---------------- */
 
      const video = document.createElement("video");
 
      video.src = "./video.mp4";
      video.crossOrigin = "anonymous";
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");
      video.preload = "auto";
 
      video.addEventListener("error", () => {
        const code = video.error ? video.error.code : "?";
        showError("video.mp4 could not be loaded (code " + code + ").");
      });
 
      /* ---------------- VIDEO TEXTURE ---------------- */
 
      const videoTexture = new THREE.VideoTexture(video);
 
      videoTexture.colorSpace = THREE.SRGBColorSpace;
      videoTexture.center.set(0.5, 0.5);
      videoTexture.rotation =
        VIDEO_ROTATION_DEG * Math.PI / 180;
 
      /*
       * This is the original poster-sized AR overlay.
       * The video does NOT become full-screen.
       */
      const geometry =
        new THREE.PlaneGeometry(1, TARGET_ASPECT);
 
      const material =
        new THREE.MeshBasicMaterial({
          map: videoTexture,
          toneMapped: false,
          transparent: true,
          opacity: 0
        });
 
      const plane = new THREE.Mesh(
        geometry,
        material
      );
 
      plane.position.set(0, 0, 0.01);
      anchor.group.add(plane);
 
      /* ---------------- VIDEO CROPPING ---------------- */
 
      function fitVideoCover() {
        const rotated90 =
          Math.abs(VIDEO_ROTATION_DEG % 180) === 90;
 
        const w = video.videoWidth || 16;
        const h = video.videoHeight || 9;
 
        const displayAspect =
          (rotated90 ? h : w) /
          (rotated90 ? w : h);
 
        const planeAspect =
          1 / TARGET_ASPECT;
 
        let cropW = 1;
        let cropH = 1;
 
        if (displayAspect > planeAspect) {
          cropW = planeAspect / displayAspect;
        } else {
          cropH = displayAspect / planeAspect;
        }
 
        const rawCropW =
          rotated90 ? cropH : cropW;
 
        const rawCropH =
          rotated90 ? cropW : cropH;
 
        videoTexture.repeat.set(
          rawCropW,
          rawCropH
        );
 
        videoTexture.offset.set(
          (1 - rawCropW) / 2,
          (1 - rawCropH) / 2
        );
 
        videoTexture.needsUpdate = true;
      }
 
      video.addEventListener(
        "loadedmetadata",
        fitVideoCover
      );
 
      fitVideoCover();
 
      /* ---------------- AUDIO BUTTON ---------------- */
 
      let targetVisible = false;
      let soundOn = false;
 
      audioBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        event.stopPropagation();
 
        if (!targetVisible) return;
 
        try {
          if (video.muted) {
            video.muted = false;
            video.volume = 1;
 
            await video.play();
 
            soundOn = true;
            audioBtn.textContent = "🔊";
            audioBtn.setAttribute(
              "aria-label",
              "Mute video"
            );
          } else {
            video.muted = true;
            soundOn = false;
 
            audioBtn.textContent = "🔇";
            audioBtn.setAttribute(
              "aria-label",
              "Unmute video"
            );
          }
        } catch (error) {
          console.error(
            "Could not enable audio:",
            error
          );
 
          video.muted = true;
          soundOn = false;
          audioBtn.textContent = "🔇";
        }
      });
 
      /* ---------------- IMAGE DETECTION ---------------- */
 
      /* ---------------- START CAMERA ---------------- */
 
      setStatus("requesting camera permission…");
 
      try {
        await mindarThree.start();
      } catch (error) {
        throw new Error(cameraError(error));
      }
 
      setStatus("camera started — waiting for target image…");
 
      // Confirms whether MindAR actually inserted a <video>/<canvas>
      // into the page. If this never appears in the status text,
      // MindAR itself isn't rendering anything into #ar-container.
      const arContainer = document.querySelector("#ar-container");
      const camVideoTag = arContainer.querySelector("video");
      const camCanvasTag = arContainer.querySelector("canvas");
      setStatus(
        "camera live — video tag: " + (camVideoTag ? "yes" : "NO") +
        ", canvas tag: " + (camCanvasTag ? "yes" : "NO")
      );
 
      anchor.onTargetFound = () => {
        setStatus("target FOUND — playing video");
        targetVisible = true;
 
        focusMessage.classList.add("hidden");
        audioBtn.classList.add("show");
 
        soundOn = false;
        video.muted = true;
        audioBtn.textContent = "🔇";
 
        video.currentTime = 0;
 
        video.play().catch(error => {
          console.error(
            "Muted autoplay failed:",
            error
          );
          setStatus("video.play() failed: " + error.message);
        });
      };
 
      anchor.onTargetLost = () => {
        setStatus("target lost — waiting for target image…");
        targetVisible = false;
 
        focusMessage.classList.remove("hidden");
        audioBtn.classList.remove("show");
 
        video.pause();
        video.muted = true;
 
        soundOn = false;
        audioBtn.textContent = "🔇";
      };
 
      renderer.setAnimationLoop(() => {
        // Video appears fully over the poster as soon as it's
        // detected (no fade), and disappears instantly when lost.
        material.opacity = targetVisible ? 1 : 0;
 
        renderer.render(
          scene,
          camera
        );
      });
 
    } catch (error) {
      console.error(error);
 
      showError(
        error && error.message
          ? error.message
          : String(error)
      );
    }
  }
 
  /*
   * Automatically start.
   * No Start button and no scanner UI.
   */
  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      startAR,
      { once: true }
    );
  } else {
    startAR();
  }
</script>
 
</body>
</html>
